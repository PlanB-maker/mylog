<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C" id="themeColor">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>My Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first app shell, one column (max 480px), fixed bottom tab bar + floating add button. Dark-first. */
:root{
  --bg:#0B0B0C; --surface:#151517; --surface2:#1E1E21; --line:#2A2A2F; --track:#2A2A2F;
  --fg:#F2F2F3; --muted:#9A9AA0; --faint:#6B6B72;
  --accent:#F01E14; --accent-fg:#FFFFFF; --accent-text:#FF4A3D;
  --sick:#F5A524; --personal:#4DABFF; --vac:#34D399; --unknown:#B9B9C0; --warn:#F5A524;
  --texture:rgba(255,255,255,0.018); --overlay:rgba(0,0,0,0.6); --on-leave:#111111;
  --font-th:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai',sans-serif;
  --font-num:'Rajdhani','IBM Plex Sans Thai',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F5; --surface:#FFFFFF; --surface2:#EDEDEF; --line:#E1E1E5; --track:#E4E4E7;
    --fg:#141416; --muted:#5E5E66; --faint:#8A8A92;
    --accent:#D7140B; --accent-fg:#FFFFFF; --accent-text:#C4120A;
    --sick:#B45309; --personal:#0B6BCB; --vac:#0F7A45; --unknown:#5E5E66; --warn:#B45309;
    --texture:rgba(0,0,0,0.025); --overlay:rgba(20,20,22,0.45); --on-leave:#FFFFFF;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F5; --surface:#FFFFFF; --surface2:#EDEDEF; --line:#E1E1E5; --track:#E4E4E7;
  --fg:#141416; --muted:#5E5E66; --faint:#8A8A92;
  --accent:#D7140B; --accent-fg:#FFFFFF; --accent-text:#C4120A;
  --sick:#B45309; --personal:#0B6BCB; --vac:#0F7A45; --unknown:#5E5E66; --warn:#B45309;
  --texture:rgba(0,0,0,0.025); --overlay:rgba(20,20,22,0.45); --on-leave:#FFFFFF;
  color-scheme:light;
}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:repeating-linear-gradient(45deg,var(--texture) 0 2px,transparent 2px 6px);
  color:var(--fg); font-family:var(--font-th); font-size:15px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.cut-tr{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.cut-2{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.cut-br{clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;padding-block:22px 10px;gap:12px}
header.top .date{font-size:13px;color:var(--muted);letter-spacing:.04em}
header.top h1{margin:0;font-size:24px;font-weight:700;line-height:1.25;text-wrap:balance}
.head-actions{display:flex;align-items:center;gap:8px}
.theme-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.badge{font-family:var(--font-num);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--accent-text);
  border:1px solid var(--accent-text);padding:4px 10px;background:none;cursor:pointer;min-height:32px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

.stack{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0}
.sec-h h2{margin:0;font-size:15px;font-weight:600}
.sec-h .aside{font-size:12px;color:var(--muted)}
.link-btn{background:none;border:0;color:var(--accent-text);font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px;min-height:36px}

.card{background:var(--surface)}
.holiday{padding:18px 20px 18px 23px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.holiday::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;background:var(--accent)}
.holiday .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.holiday .name{font-size:20px;font-weight:700;line-height:1.3}
.holiday .sub{font-size:13px;color:var(--muted)}
.holiday .count{display:flex;flex-direction:column;align-items:center;min-width:72px}
.holiday .count b{font-family:var(--font-num);font-weight:700;font-size:52px;line-height:.9;color:var(--accent-text)}
.holiday .count span{font-size:12px;color:var(--muted)}

.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge{padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center}
.gauge svg{display:block}
.gauge .val{font-family:var(--font-num);font-weight:700;font-size:32px;line-height:1;margin-top:-24px}
.gauge .t{font-size:13px;font-weight:600;margin-top:6px}
.gauge .u{font-size:11px;color:var(--muted)}
.gauge.over .val{color:var(--accent-text)}

.todo{display:flex;flex-direction:column;gap:8px}
.todo-item{width:100%;text-align:left;border:0;background:var(--surface);padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer}
.todo-item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.todo-item .tx b{font-size:14px;font-weight:600}
.todo-item .tx span{font-size:12px;color:var(--muted)}
.todo-item.overdue .tx b{color:var(--accent-text)}
.all-done{padding:14px;font-size:13px;color:var(--muted);background:var(--surface);display:flex;gap:10px;align-items:center}

.month-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.month-strip > div{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.month-strip > div + div{border-left:1px solid var(--line)}
.month-strip .k{font-size:11px;color:var(--muted)}
.month-strip .v{font-family:var(--font-num);font-weight:700;font-size:26px;line-height:1.1}
.month-strip .v small{font-size:13px;color:var(--muted);font-weight:600;font-family:var(--font-th)}
.month-strip .v.na{color:var(--faint)}
.month-strip .note{font-size:11px;color:var(--faint)}

/* calendar */
.cal{padding:14px 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.icon-btn{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg)}
.icon-btn:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-day{aspect-ratio:1/1.05;border:0;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-num);font-weight:600;font-size:16px;cursor:pointer;position:relative;padding:0;min-height:40px}
.cal-day.empty{background:none;cursor:default}
.cal-day.we{background:none;color:var(--faint)}
.cal-day.hol{background:none;color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal-day.lv{color:var(--on-leave)}
.cal-day.lv.sick{background:var(--sick)}
.cal-day.lv.personal{background:var(--personal)}
.cal-day.lv.vacation{background:var(--vac)}
.cal-day.lv.unknown{background:none;color:var(--fg);box-shadow:inset 0 0 0 2px var(--unknown);border-style:dashed}
.cal-day.lv.half{background-image:linear-gradient(135deg,transparent 50%,var(--surface2) 50%)}
.cal-day .dot{width:5px;height:5px;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.c-sick{color:var(--sick)}.c-personal{color:var(--personal)}.c-vacation{color:var(--vac)}.c-unknown{color:var(--unknown)}
.bg-sick{background:var(--sick)}.bg-personal{background:var(--personal)}.bg-vacation{background:var(--vac)}.bg-unknown{background:var(--unknown)}

.lv-list{display:flex;flex-direction:column}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;min-width:58px;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 8px;cursor:pointer;font-size:13px;line-height:1.2}
.mchip small{font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:600}
.mchip.has small{color:var(--warn)}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.mchip[aria-pressed="true"] small{color:var(--accent-fg)}
.mchip:disabled{opacity:.35;cursor:default}
.lv-month{font-size:12px;color:var(--muted);letter-spacing:.06em;padding:14px 4px 6px}
.lv-row{width:100%;border:0;background:var(--surface);text-align:left;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;min-height:60px}
.lv-row + .lv-row{border-top:1px solid var(--line)}
.lv-row .d{display:flex;flex-direction:column;align-items:center;line-height:1}
.lv-row .d b{font-family:var(--font-num);font-size:26px;font-weight:700}
.lv-row .d span{font-size:11px;color:var(--muted);margin-top:4px}
.lv-row .m{min-width:0;display:flex;flex-direction:column;gap:3px}
.lv-row .m .r{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row .flag{font-size:11px;color:var(--warn);display:inline-flex;align-items:center;gap:4px}
.lv-row .ok{font-size:11px;color:var(--muted)}

.ts-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border:0;width:100%;text-align:left;cursor:pointer;min-height:52px}
.ts-row + .ts-row{border-top:1px solid var(--line)}
.ts-row .st{font-size:12px;display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ok-t{color:var(--vac)} .no-t{color:var(--warn)}

.hol-row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);font-size:14px}
.hol-row + .hol-row{border-top:1px solid var(--line)}
.hol-row.past{color:var(--faint)}
.hol-row .num{font-weight:600}

.tool-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-fg);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-ghost{background:var(--surface);color:var(--fg)}
.btn-danger{background:none;color:var(--accent-text);border:1px solid var(--accent-text)}
.btn-danger.armed{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.tl-imp{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tl-imp .tx{display:flex;flex-direction:column;min-width:0}
.tl-imp .tx b{font-size:16px}
.tl-imp .tx span{font-size:12px;color:var(--muted)}
.tl-how{font-size:12px;margin:-6px 4px 0}
.tl-nav{padding:4px}
.tl-how .link-btn{min-height:0;padding:0 2px;font-size:12px}
.tl-steps{margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tl-note{font-size:12px;margin:0 4px}
.tl-list{display:flex;flex-direction:column}
.tl-abs{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:0;width:100%;text-align:left;min-height:60px;flex-wrap:wrap}
.tl-abs + .tl-abs{border-top:1px solid var(--line)}
.tl-abs .tx{display:flex;flex-direction:column;flex:1;min-width:150px}
.tl-abs .tx b{font-size:14px}
.tl-abs .tx span{font-size:12px;color:var(--warn)}
.tl-abs .acts{display:flex;gap:6px}
.tl-abs .acts .btn{min-height:40px;padding:8px 12px;font-size:13px;background:var(--surface2)}
.tl-abs.warn{cursor:pointer}
.tl-travel{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tl-travel .split{height:8px;background:var(--track);display:flex}
.tl-travel .split i{display:block;height:100%;background:var(--accent)}
.split-lbl,.tl-travel .modes,.tl-travel .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.split-lbl span{display:inline-flex;align-items:center;gap:6px}
.split-lbl .sw{width:10px;height:10px;display:inline-block}
.split-lbl .sw.a{background:var(--accent)} .split-lbl .sw.b{background:var(--track);box-shadow:inset 0 0 0 1px var(--faint)}
.tl-travel b.num{color:var(--fg);font-weight:600;font-size:15px}
.tl-travel .c2m{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.tl-travel .c2m .link-btn{min-height:0;padding:0 2px;font-size:12px}
.tl-pl{display:flex;align-items:center;background:var(--surface)}
.tl-pl + .tl-pl{border-top:1px solid var(--line)}
.tl-pl .nm{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 6px 10px 14px;display:flex;flex-direction:column;cursor:pointer;min-height:56px;justify-content:center}
.tl-pl .nm b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-pl .nm b.unnamed{color:var(--faint);font-weight:500}
.tl-pl .nm span{font-size:12px;color:var(--muted)}
.tl-pl a.icon-btn{color:var(--accent-text);flex:0 0 auto}
.placeholder{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.placeholder b{font-size:17px}
.placeholder p{margin:0;color:var(--muted);font-size:14px;max-width:32ch}
.placeholder ul{margin:6px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}

.pending-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--warn);font-size:13px;margin-top:8px}
.pending-bar b{color:var(--warn)}
.tag-pending{font-size:11px;color:var(--warn);border:1px dashed var(--warn);padding:0 6px;margin-left:6px}
.sheet .btn-ghost{background:var(--surface2);border:1px solid var(--line)}
.onboard{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.onboard b{font-size:17px}
.onboard p{margin:0;color:var(--muted);font-size:14px}
.set-sec{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.set-sec h4{margin:0 0 10px;font-size:15px}
.sync-status{font-size:13px;color:var(--muted);margin:0 0 12px}
.sync-status.bad{color:var(--accent-text)}
.banner{padding:12px 14px;background:var(--surface);border:1px solid var(--warn);font-size:13px;color:var(--fg);margin-top:8px}

/* fab + nav */
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border:0;background:var(--accent);color:var(--accent-fg);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
.fab-menu{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(162px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:21;align-items:flex-end}
.fab-menu .btn{background:var(--surface2);color:var(--fg);min-width:170px;justify-content:flex-start;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.fab-menu .btn:disabled{color:var(--faint);cursor:default}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:72px}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent-text);font-weight:600}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  clip-path:polygon(0 18px,18px 0,100% 0,100% 100%,0 100%)}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.field > .lab{font-size:13px;color:var(--muted)}
.input{background:var(--surface2);border:1px solid var(--line);padding:10px 12px;min-height:44px;width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{background:var(--surface2);border:1px solid var(--line);min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;text-align:center;padding:4px}
.seg input:checked + label{border-color:currentColor;font-weight:700;box-shadow:inset 0 0 0 1px currentColor}
.seg input:focus-visible + label{outline:2px solid var(--accent-text);outline-offset:2px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.check small{color:var(--muted);font-size:12px}
.req{color:var(--warn);font-size:11px;font-weight:600}
.err{color:var(--accent-text);font-size:13px;min-height:1.2em}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;font-size:14px;z-index:60;max-width:90%}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="date" id="todayLabel">&nbsp;</div>
      <h1>สวัสดี แบงค์</h1>
    </div>
    <div class="head-actions">

<script>
/*LOGIC START*/
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TYPES = {
  sick:     { label:'ป่วย',      full:'ลาป่วย' },
  personal: { label:'กิจ',       full:'ลากิจ' },
  vacation: { label:'พักร้อน',   full:'ลาพักร้อน' },
  unknown:  { label:'ยังไม่ระบุ', full:'ยังไม่ระบุประเภท' }
};
const DOCS = { form:'ใบลา', cert:'ใบรับรองแพทย์', evidence:'หลักฐานประกอบ' };
const QUOTA_DEFAULT = { sick:30, personal:6, vacation:6 };

const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => parse(s).getDay();
const isWeekend = s => { const w = dow(s); return w===0 || w===6; };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const beYear = y => y + 543;
const fmtShort = s => { const d = parse(s); return d.getDate()+' '+TH_M[d.getMonth()]; };
const fmtDay = s => { const d = parse(s); return TH_D[d.getDay()]+' '+d.getDate()+' '+TH_M[d.getMonth()]; };
const fmtLong = s => { const d = parse(s); return TH_D[d.getDay()]+' '+d.getDate()+' '+TH_M[d.getMonth()]+' '+beYear(d.getFullYear()); };
const monthKey = s => s.slice(0,7);
const fmtMonth = key => { const [y,m] = key.split('-').map(Number); return TH_MF[m-1]+' '+beYear(y); };

function holidayMap(list){ const m = new Map(); (list||[]).forEach(h => m.set(h.date, h.name)); return m; }
function isWorkday(s, hmap){ return !isWeekend(s) && !hmap.has(s); }
function leaveAmount(l){ return l.half ? 0.5 : 1; }

function balances(leaves, quota, year){
  const q = Object.assign({}, QUOTA_DEFAULT, quota||{});
  const out = {};
  ['sick','personal','vacation'].forEach(t => out[t] = { quota:q[t], used:0, left:q[t] });
  let unknown = 0;
  (leaves||[]).forEach(l => {
    if (!l.date || Number(l.date.slice(0,4)) !== year) return;
    if (l.type === 'unknown') { unknown += leaveAmount(l); return; }
    if (out[l.type]) out[l.type].used += leaveAmount(l);
  });
  Object.values(out).forEach(o => o.left = o.quota - o.used);
  return { ...out, unknown };
}

function adjacentToHoliday(date, hmap){
  let p = addDays(date,-1); while (isWeekend(p)) p = addDays(p,-1);
  let n = addDays(date, 1); while (isWeekend(n)) n = addDays(n, 1);
  return hmap.has(p) || hmap.has(n);
}
function sickRunLength(date, leaves, hmap){
  const sick = new Set((leaves||[]).filter(l => l.type==='sick').map(l => l.date));
  if (!sick.has(date)) return 0;
  const step = (s,dir) => { let x = addDays(s,dir); while (!isWorkday(x,hmap)) x = addDays(x,dir); return x; };
  let len = 1, x = step(date,-1);
  while (sick.has(x)) { len++; x = step(x,-1); }
  x = step(date,1);
  while (sick.has(x)) { len++; x = step(x,1); }
  return len;
}
function requiredDocs(l, hmap, leaves){
  if (l.type === 'personal') return ['form','evidence'];
  if (l.type === 'vacation') return ['form'];
  if (l.type === 'sick') {
    const r = ['form'];
    if (adjacentToHoliday(l.date, hmap) || sickRunLength(l.date, leaves, hmap) >= 3) r.push('cert');
    return r;
  }
  return [];
}
function missingDocs(l, hmap, leaves){ return requiredDocs(l,hmap,leaves).filter(k => !(l.docs && l.docs[k])); }

function lastWorkday(key, hmap){
  const [y,m] = key.split('-').map(Number);
  let s = iso(new Date(y, m, 0));
  while (!isWorkday(s,hmap)) s = addDays(s,-1);
  return s;
}
function nextHoliday(today, list){
  return (list||[]).filter(h => h.date >= today).sort((a,b) => a.date < b.date ? -1 : 1)[0] || null;
}
function longBreak(date, hmap){
  const off = s => isWeekend(s) || hmap.has(s);
  let a = date, b = date;
  while (off(addDays(a,-1))) a = addDays(a,-1);
  while (off(addDays(b, 1))) b = addDays(b, 1);
  return { start:a, end:b, days: daysBetween(a,b)+1 };
}
function monthsFrom(startKey, endKey){
  const out = []; let [y,m] = startKey.split('-').map(Number);
  const [ey,em] = endKey.split('-').map(Number);
  while (y < ey || (y===ey && m<=em)) { out.push(y+'-'+pad(m)); m++; if (m>12){m=1;y++;} }
  return out;
}
function buildTodos(state, today){
  const hmap = holidayMap(state.holidays);
  const todos = [];
  const cur = monthKey(today);
  const start = (state.settings && state.settings.startMonth) || '2026-03';
  monthsFrom(start, cur).forEach(k => {
    const ts = state.timesheets[k] || {};
    if (ts.sent) return;
    const due = lastWorkday(k, hmap);
    const overdue = k < cur || today > due;
    if (k === cur || overdue) {
      todos.push({ kind:'timesheet', key:k, overdue,
        title:'Timesheet '+TH_M[Number(k.slice(5))-1]+' '+(ts.signed ? 'เซ็นแล้ว รอส่ง HR' : 'ยังไม่ส่ง'),
        sub: overdue ? 'เลยกำหนดส่ง '+fmtDay(due) : 'ส่ง HR ภายใน '+fmtDay(due) });
    }
  });
  const unknowns = state.leaves.filter(l => l.type==='unknown').sort((a,b)=>a.date<b.date?-1:1);
  if (unknowns.length) {
    todos.push({ kind:'unknown', ids: unknowns.map(l=>l.id),
      title: summarizeDates(unknowns.map(l=>l.date))+' ยังไม่มีใบลา',
      sub: 'ขาดงานจาก Timeline · แตะเพื่อระบุประเภทลา' });
  }
  const abs = allAbsences(state);
  if (abs.length) todos.push({ kind:'absent', key: monthKey(abs[0]),
    title: (abs.length === 1 ? fmtShort(abs[0]) : summarizeDates(abs))+' ไม่พบว่าไปทำงาน',
    sub: 'จาก Timeline · แตะเพื่อแจ้งลาหรือยืนยันว่าไปทำงาน' });
  state.leaves.filter(l => l.type!=='unknown').sort((a,b)=>a.date<b.date?-1:1).forEach(l => {
    const miss = missingDocs(l, hmap, state.leaves);
    if (miss.length) todos.push({ kind:'docs', id:l.id,
      title: TYPES[l.type].full+' '+fmtShort(l.date)+' ขาดเอกสาร',
      sub: miss.map(k=>DOCS[k]).join(' · ') });
  });
  return todos;
}
function summarizeDates(dates){
  if (!dates.length) return '';
  if (dates.length === 1) return fmtShort(dates[0]);
  const sameMonth = dates.every(d => monthKey(d) === monthKey(dates[0]));
  const consecutive = dates.every((d,i) => i===0 || daysBetween(dates[i-1], d) === 1);
  if (sameMonth && consecutive) { const a = parse(dates[0]), b = parse(dates[dates.length-1]);
    return a.getDate()+'–'+b.getDate()+' '+TH_M[a.getMonth()]; }
  return dates.length+' วัน';
}
function leaveSummaryText(state, year){
  const b = balances(state.leaves, state.settings.quota, year);
  const lines = ['สรุปการลา ปี '+beYear(year)];
  ['sick','personal','vacation'].forEach(t => lines.push(TYPES[t].full+' ใช้ '+fmtNum(b[t].used)+'/'+b[t].quota+' เหลือ '+fmtNum(b[t].left)+' วัน'));
  lines.push('');
  state.leaves.filter(l => Number(l.date.slice(0,4))===year && l.type!=='unknown').sort((a,b)=>a.date<b.date?-1:1).forEach(l => {
    let s = '- '+fmtLong(l.date)+' '+TYPES[l.type].full;
    if (l.half) s += l.half==='am' ? ' (ครึ่งเช้า)' : ' (ครึ่งบ่าย)';
    if (l.reason) s += ' – '+l.reason;
    lines.push(s);
  });
  return lines.join('\n');
}
function fmtNum(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function prevWorkday(s, hmap){ let x = addDays(s,-1); while (!isWorkday(x,hmap)) x = addDays(x,-1); return x; }
function shiftMonthKey(k, n){ let [y,m] = k.split('-').map(Number); m += n; while (m < 1){ m += 12; y--; } while (m > 12){ m -= 12; y++; } return y+'-'+pad(m); }
const REMINDER_KIND = { prep:1, send:2, export:3 };
function reminderAt(dateStr, hhmm){ const [h,m] = hhmm.split(':').map(Number); const d = parse(dateStr); d.setHours(h, m, 0, 0); return d; }
function compactDates(ds){ // ['2026-09-08','2026-09-28','2026-10-01'] -> '8, 28 ก.ย., 1 ต.ค.'
  const groups = []; ds.slice().sort().forEach(d => { const k = d.slice(0,7); const g = groups[groups.length-1];
    if (g && g.k === k) g.days.push(Number(d.slice(8))); else groups.push({ k, days:[Number(d.slice(8))] }); });
  return groups.map(g => g.days.join(', ')+' '+TH_M[Number(g.k.slice(5))-1]).join(', ');
}
function computeReminders(st, now, months){
  months = months || 3;
  const hmap = holidayMap(st.holidays);
  const today = iso(now);
  const keys = monthsFrom(monthKey(today), shiftMonthKey(monthKey(today), months-1));
  const out = [];
  const add = (dateStr, hhmm, kind, title, body) => out.push({ id: Number(dateStr.replace(/-/g,''))*10 + REMINDER_KIND[kind], at: reminderAt(dateStr, hhmm), date: dateStr, kind, title, body });
  keys.forEach(k => {
    const ts = st.timesheets[k] || {};
    const due = lastWorkday(k, hmap), prep = prevWorkday(due, hmap);
    const mname = TH_MF[Number(k.slice(5))-1];
    if (!ts.signed && !ts.sent)
      add(prep, '10:00', 'prep', 'เตรียม Timesheet '+mname, 'ขอหัวหน้าเซ็นวันนี้ · ส่ง HR '+(daysBetween(prep, due) === 1 ? 'พรุ่งนี้ ' : '')+fmtDay(due));
    if (!ts.sent) {
      const miss = st.leaves.filter(l => l.type !== 'unknown' && l.date <= due && missingDocs(l, hmap, st.leaves).length).sort((a,b) => a.date < b.date ? -1 : 1);
      const unk = st.leaves.filter(l => l.type === 'unknown' && l.date <= due).length;
      const parts = ['form','cert','evidence'].map(dk => {
        const ds = miss.filter(l => missingDocs(l, hmap, st.leaves).includes(dk)).map(l => l.date);
        return ds.length ? DOCS[dk]+' '+compactDates(ds) : '';
      }).filter(Boolean);
      let body = parts.length ? 'แนบ '+parts.join(' · ') : 'ส่ง Timesheet ให้ HR (APNS) วันนี้';
      if (unk) body += ' · ระบุประเภทลา '+unk+' วัน';
      add(due, '13:00', 'send', 'วันนี้ส่ง Timesheet '+mname, body);
    }
    add(shiftMonthKey(k, 1)+'-01', '20:00', 'export', 'Export Timeline เดือน'+mname, 'แตะเพื่ออัปเดต Timeline ในแอป (ส่งออกแล้วเลือกไฟล์)');
  });
  return out.filter(r => r.at > now).sort((a,b) => a.at - b.at);
}
/* ---- Timeline (phase 2) ---- */
const MODE_TH = { MOTORCYCLING:'มอเตอร์ไซค์', IN_PASSENGER_VEHICLE:'รถยนต์', IN_VEHICLE:'รถยนต์', WALKING:'เดิน', RUNNING:'วิ่ง', CYCLING:'จักรยาน',
  IN_BUS:'รถเมล์', IN_SUBWAY:'รถไฟฟ้า', IN_TRAIN:'รถไฟ', IN_TRAM:'รถราง', FLYING:'เครื่องบิน', IN_FERRY:'เรือ', SAILING:'เรือ' };
const modeTh = m => MODE_TH[m] || 'อื่นๆ';
const CAR_MODES = ['IN_PASSENGER_VEHICLE','IN_VEHICLE'];
// km by mode, optionally counting what Google called "car" as motorcycle (Google mislabels bikes when a Bluetooth headset is connected)
function effModes(byMode, carAsMoto){
  const out = {};
  Object.entries(byMode||{}).forEach(([k,v]) => { const kk = carAsMoto && CAR_MODES.includes(k) ? 'MOTORCYCLING' : k; out[kk] = Math.round(((out[kk]||0) + v)*10)/10; });
  return Object.fromEntries(Object.entries(out).sort((a,b) => b[1]-a[1]));
}
function carKm(byMode){ return CAR_MODES.reduce((s,k) => s + ((byMode||{})[k]||0), 0); }
function parseLatLng(s){
  const p = String(s||'').replace(/geo:|°/g,'').split(',').map(x => parseFloat(x));
  return p.length === 2 && isFinite(p[0]) && isFinite(p[1]) ? [p[0], p[1]] : null;
}
function geoDist(a, b){
  const r = x => x*Math.PI/180, R = 6371000;
  const dLa = r(b[0]-a[0]), dLo = r(b[1]-a[1]);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// Pull one top-level value out of a big JSON text without parsing the rest (rawSignals is ~90% of the file)
function extractJsonValue(text, key){
  const k = text.indexOf('"'+key+'"'); if (k < 0) return undefined;
  let i = text.indexOf(':', k + key.length + 2); if (i < 0) return undefined;
  i++; while (/\s/.test(text[i])) i++;
  const open = text[i], close = open === '[' ? ']' : open === '{' ? '}' : null;
  if (!close) return undefined;
  let depth = 0, inStr = false;
  for (let j = i; j < text.length; j++){
    const c = text.charCodeAt(j);
    if (inStr) { if (c === 92) j++; else if (c === 34) inStr = false; continue; }
    if (c === 34) inStr = true;
    else if (c === 91 || c === 123) depth++;
    else if (c === 93 || c === 125) { depth--; if (depth === 0) return JSON.parse(text.slice(i, j+1)); }
  }
  throw new Error('truncated');
}
function readTimelineText(text){
  const segs = extractJsonValue(text, 'semanticSegments');
  if (!Array.isArray(segs)) return null;
  let profile = null; try { profile = extractJsonValue(text, 'userLocationProfile') || null; } catch(e){}
  return { semanticSegments: segs, userLocationProfile: profile };
}
const hhmm = s => Number(String(s).slice(11,13))*60 + Number(String(s).slice(14,16));
function analyzeTimeline(tl){
  const segs = (tl && tl.semanticSegments || []).filter(s => s && s.startTime && s.endTime && (s.visit || s.activity || s.timelinePath));
  if (!segs.length) return null;
  const freq = (tl.userLocationProfile && tl.userLocationProfile.frequentPlaces) || [];
  const anchor = lab => { const f = freq.find(p => p.label === lab); return f ? parseLatLng(f.placeLocation) : null; };
  const HOME = anchor('HOME'), WORK = anchor('WORK');
  let first = null, last = null;
  segs.forEach(s => { if (!first || s.startTime < first) first = s.startTime; if (!last || s.endTime > last) last = s.endTime; });
  // a day counts as covered only when the data spans it (starts by 08:00 / ends after 18:00)
  const from = hhmm(first) <= 8*60 ? first.slice(0,10) : addDays(first.slice(0,10), 1);
  const to = hhmm(last) >= 18*60 ? last.slice(0,10) : addDays(last.slice(0,10), -1);
  const months = {};
  const M = k => months[k] || (months[k] = { km:0, wkdayKm:0, wkendKm:0, trips:0, moveMin:0, byMode:{}, travel:new Set(), work:new Set(), data:new Set(),
    hours:{ home:0, work:0, other:0 }, pl:{}, longest:null });
  const dayRange = (a, b) => { const out = []; let x = a; while (x <= b && out.length < 40) { out.push(x); x = addDays(x, 1); } return out; };
  segs.forEach(s => {
    const a = s.startTime.slice(0,10), b = s.endTime.slice(0,10);
    const mins = Math.max(0, (Date.parse(s.endTime) - Date.parse(s.startTime)) / 60000);
    dayRange(a, b).forEach(d => M(monthKey(d)).data.add(Number(d.slice(8))));
    const m = M(monthKey(a));
    if (s.activity) {
      const km = (Number(s.activity.distanceMeters) || 0) / 1000;
      const mode = (s.activity.topCandidate && s.activity.topCandidate.type) || 'UNKNOWN';
      m.km += km; m.trips++; m.moveMin += mins; m.travel.add(Number(a.slice(8)));
      if (isWeekend(a)) m.wkendKm += km; else m.wkdayKm += km;
      m.byMode[mode] = (m.byMode[mode] || 0) + km;
      if (!m.longest || km > m.longest.km) m.longest = { km, date:a, mode };
    } else if (s.visit) {
      const top = s.visit.topCandidate || {}, ll = parseLatLng(top.placeLocation && (top.placeLocation.latLng || top.placeLocation));
      const st = String(top.semanticType || '');
      const kind = /WORK/.test(st) || (WORK && ll && geoDist(ll, WORK) < 200) ? 'work'
        : /HOME/.test(st) || (HOME && ll && geoDist(ll, HOME) < 150) ? 'home' : 'other';
      m.hours[kind] += mins / 60;
      if (kind === 'work') dayRange(a, b).forEach(d => M(monthKey(d)).work.add(Number(d.slice(8))));
      else if (kind === 'other' && top.placeId) {
        const p = m.pl[top.placeId] || (m.pl[top.placeId] = { id:top.placeId, ll: ll ? ll[0].toFixed(6)+','+ll[1].toFixed(6) : '', n:0, min:0, last:a });
        p.n++; p.min += mins; if (a > p.last) p.last = a;
      }
    }
  });
  const r1 = x => Math.round(x*10)/10, sortN = set => [...set].sort((x,y) => x-y);
  const out = {};
  Object.keys(months).sort().forEach(k => {
    const m = months[k], ms = k+'-01', me = k+'-'+pad(new Date(Number(k.slice(0,4)), Number(k.slice(5)), 0).getDate());
    const f = from > ms ? from : ms, t = to < me ? to : me;
    const byMode = {}; Object.entries(m.byMode).sort((x,y) => y[1]-x[1]).forEach(([mo,km]) => { if (km >= 0.05) byMode[mo] = r1(km); });
    out[k] = { v:1, from: f <= t ? f : null, to: f <= t ? t : null,
      km: r1(m.km), wkdayKm: r1(m.wkdayKm), wkendKm: r1(m.wkendKm), trips: m.trips, moveH: r1(m.moveMin/60), byMode,

}

  const byDate = new Map(); leaves.forEach(l => byDate.set(l.date, l));
  const work = new Set(m.work||[]), data = new Set(m.data||[]), ok = new Set(m.ok||[]);

}

    const bm = Object.entries(effModes(m.byMode, st.settings && st.settings.carAsMoto)).map(([k,v]) => modeTh(k)+' '+fmtNum(v)); if (bm.length) lines.push('แยกตามพาหนะ: '+bm.join(' · ')+' กม.');
    lines.push('อยู่ที่ทำงาน '+(m.work||[]).length+' วัน');

const STORE_KEY = 'mylog.store.v1', SYNC_KEY = 'mylog.sync.v1';
function loadJSON(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
let store = loadJSON(STORE_KEY, null) || { docs:{}, dirty:[] };
if (!store.docs || typeof store.docs !== 'object') store.docs = {};
if (!Array.isArray(store.dirty)) store.dirty = [];
let syncCfg = Object.assign({ url:'', token:'', since:null, lastSyncAt:null, lastError:'' }, loadJSON(SYNC_KEY, {}) || {});
let storageOk = saveJSON(STORE_KEY, store);
function persist(){ storageOk = saveJSON(STORE_KEY, store); }
function saveSync(){ saveJSON(SYNC_KEY, syncCfg); }
const nowIso = () => new Date().toISOString();
function putDoc(path, data, deleted){
  store.docs[path] = { data: deleted ? null : data, updatedAt: nowIso(), deleted: !!deleted };
  if (!store.dirty.includes(path)) store.dirty.push(path);
  persist();
}
async function commit(path, op, data){

  render(); scheduleSync(1500);
  return 'saved';
}
function recompute(){
  const leaves = [], ts = {}, hol = [], months = {}, places = {}; let settings = SETTINGS_DEFAULT();
  Object.entries(store.docs).forEach(([p, d]) => {
    if (!d || d.deleted || !d.data) return;
    const [c, id] = p.split('/');
    if (c === 'leaves') { if (d.data.date && TYPES[d.data.type]) leaves.push({ id, ...d.data }); }
    else if (c === 'timesheets') ts[id] = d.data;
    else if (c === 'holidays') hol.push(...(d.data.days || []));
    else if (c === 'months') months[id] = d.data;
    else if (c === 'places') places[id] = d.data;

/* ---------- Google Sheets sync (Apps Script) ---------- */
let syncing = false, syncTimer = null, syncState = 'idle';
const syncConfigured = () => !!(syncCfg.url && syncCfg.token);
function scheduleSync(ms){ clearTimeout(syncTimer); if (syncConfigured()) syncTimer = setTimeout(() => sync(), ms); }
async function callScript(body){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), window.__SYNC_TIMEOUT || 20000);
  try {
    const res = await fetch(syncCfg.url, { method:'POST', body: JSON.stringify(body), signal: ctrl.signal, redirect:'follow' });
    const txt = await res.text(); let j;
    try { j = JSON.parse(txt); } catch(e){ throw { code:'bad_response' }; }
    if (!j || !j.ok) throw { code: (j && j.error) || 'server_error' };
    return j;
  } catch(e){
    if (e && e.name === 'AbortError') throw { code:'timeout' };
    if (e && e.code) throw e;
    throw { code:'network' };
  } finally { clearTimeout(t); }
}
function syncErrMsg(e){
  const c = e && e.code;
  if (c === 'unauthorized') return 'รหัสลับไม่ตรงกับใน Apps Script';
  if (c === 'bad_response') return 'ลิงก์ Apps Script ไม่ถูกต้อง หรือยังไม่ได้ Deploy ให้ Anyone เข้าถึง';
  if (c === 'network' || c === 'timeout') return 'ไม่มีเน็ตหรือเชื่อมต่อ Google ไม่ได้ จะลองใหม่อัตโนมัติ';
  return 'ซิงค์ไม่สำเร็จ ('+(c||'error')+')';
}
async function sync(manual){
  if (!syncConfigured()) { updateSyncBar(); if (manual) toast('ยังไม่ได้ตั้งค่าซิงค์'); return false; }
  if (syncing) return false;
  if (navigator.onLine === false) { syncState = 'offline'; updateSyncBar(); if (manual) toast('ยังไม่มีเน็ต ข้อมูลยังอยู่ในเครื่อง จะซิงค์เมื่อเน็ตกลับมา'); return false; }
  syncing = true; syncState = 'syncing'; updateSyncBar();
  const sent = store.dirty.filter(p => store.docs[p]).map(p => ({ path:p, data:store.docs[p].data, updatedAt:store.docs[p].updatedAt, deleted:!!store.docs[p].deleted }));
  let ok = false;
  try {
    const r = await callScript({ action:'sync', token:syncCfg.token, since:syncCfg.since, docs:sent });
    store.dirty = store.dirty.filter(p => { const x = sent.find(d => d.path === p); return !x || !store.docs[p] || store.docs[p].updatedAt !== x.updatedAt; });
    (r.docs || []).forEach(d => {
      if (!d || !d.path || store.dirty.includes(d.path)) return;
      const loc = store.docs[d.path];
      if (!loc || String(loc.updatedAt) <= String(d.updatedAt)) store.docs[d.path] = { data: d.deleted ? null : d.data, updatedAt: d.updatedAt, deleted: !!d.deleted };
    });
    persist();
    syncCfg.since = r.serverTime || syncCfg.since; syncCfg.lastSyncAt = nowIso(); syncCfg.lastError = ''; saveSync();
    syncState = 'idle'; ok = true;
    if (manual) toast('ซิงค์แล้ว');
  } catch(e){
    syncState = 'error'; syncCfg.lastError = (e && e.code) || 'error'; saveSync();
    if (manual) toast(syncErrMsg(e));
  } finally {
    syncing = false; render();
    if (store.dirty.length) scheduleSync(ok ? 1500 : 30000);
  }
  return ok;
}
function fmtTime(isoStr){ try { const d = new Date(isoStr); return d.getDate()+' '+TH_M[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes()); } catch(e){ return ''; } }
function updateSyncBar(){
  const bar = document.getElementById('pendingBar'); if (!bar) return;
  const n = store.dirty.length; let msg = '';
  if (!syncConfigured()) msg = Object.keys(store.docs).length ? '<b>ข้อมูลอยู่ในเครื่องนี้เท่านั้น</b> · ตั้งค่าซิงค์เพื่อสำรองขึ้น Google Sheets' : '';
  else if (syncState === 'syncing') msg = '';
  else if (n && (syncState === 'offline' || navigator.onLine === false)) msg = '<b>รอซิงค์ '+n+' รายการ</b> · จะซิงค์เมื่อเน็ตกลับมา';

  }
}

function importData(text){
  let j; try { j = JSON.parse(text); } catch(e){ return { ok:false, msg:'ไฟล์นี้ไม่ใช่ไฟล์สำรองของ My Log' }; }
  if (!j || j.app !== 'mylog' || !j.docs || typeof j.docs !== 'object') return { ok:false, msg:'ไฟล์นี้ไม่ใช่ไฟล์สำรองของ My Log' };
  const valid = /^(leaves|timesheets|holidays|settings|fuel|places|vehicle|months)\/[A-Za-z0-9_\-.~:@+]+$/;
  let n = 0;
  Object.entries(j.docs).forEach(([p, data]) => { if (valid.test(p) && data && typeof data === 'object') { putDoc(p, data, false); n++; } });
  if (!storageOk) return { ok:false, msg:'เครื่องไม่ยอมให้เก็บข้อมูล' };

async function setMonthOk(k, day){
  const m = (state.months||{})[k]; if (!m) return;
  const ok = day == null ? [] : [...new Set([...(m.ok||[]), day])].sort((a,b) => a-b);
  try { await commit('months/'+k, 'set', Object.assign({}, m, { ok })); toast(day == null ? 'ล้างการยืนยันแล้ว' : 'บันทึกว่าไปทำงาน '+fmtShort(k+'-'+pad(day))); }
  catch(ex){ toast(writeErrMsg(ex)); }
}

function pickTimelineFile(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', () => { if (inp.files && inp.files[0]) importTimelineFile(inp.files[0]); });

function importTimelineFile(file){ return importTimeline(() => file.text()); }
async function importTimeline(getText){
  const btn = $('#tlImport'), label = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'กำลังอ่านไฟล์…'; }
  toast('กำลังอ่านไฟล์…');
  await new Promise(r => setTimeout(r, 30));
  let res = null;
  try { const tl = readTimelineText(await getText()); res = tl && analyzeTimeline(tl); } catch(e){ res = null; }
  if (btn) { btn.disabled = false; btn.textContent = label; }
  if (!res) { toast('ไฟล์นี้ไม่ใช่ Timeline ที่ส่งออกจากมือถือ'); return; }
  let n = 0;
  Object.entries(res.months).forEach(([k, fresh]) => {
    const old = (state.months||{})[k], doc = mergeTimelineMonth(old, fresh);
    if (doc) { putDoc('months/'+k, doc, false); n++; }
  });
  sumMonth = null; render(); scheduleSync(1500);
  toast(n ? 'นำเข้า '+n+' เดือน ข้อมูล '+fmtShort(res.from)+'–'+fmtShort(res.to) : 'ไม่มีข้อมูลใหม่กว่าที่มีอยู่');
}

const TLFLOW_KEY = 'mylog.tlflow';
function tlFlowPending(){ try { const t = Number(localStorage.getItem(TLFLOW_KEY)); return !!t && Date.now() - t < 30*60000; } catch(e){ return false; } }
function setTlFlow(on){ try { if (on) localStorage.setItem(TLFLOW_KEY, String(Date.now())); else localStorage.removeItem(TLFLOW_KEY); } catch(e){} }
async function startTimelineUpdate(){
  closeSheet();
  if (!nat()) { pickTimelineFile(); return; }
  setTlFlow(true);
  try { await nat().openLocationSettings(); }
  catch(e){ setTlFlow(false); toast('เปิดหน้าตั้งค่าไม่ได้ ไปที่ ตั้งค่า → ตำแหน่ง → ไทม์ไลน์ เอง'); }
}
function onAppReturnTl(){
  if (!tlFlowPending()) return;
  setTlFlow(false);
  if (tab !== 'summary') setTab('summary');
  openTlSheet('return');
  pickTimelineNative();
}
async function pickTimelineNative(){
  if (!nat()) { pickTimelineFile(); return; }
  let r;
  try { r = await nat().pickJsonFile(); } catch(e){ toast('เปิดตัวเลือกไฟล์ไม่ได้'); return; }
  if (!r || r.cancelled || !r.path) return;
  closeSheet();
  await importTimeline(async () => {
    const res = await fetch(window.Capacitor.convertFileSrc(r.path));
    if (!res.ok) throw new Error('read');
    return res.text();
  });
  try { await nat().clearImportCache(); } catch(e){}
}
function openTlSheet(mode){
  const x = '<button type="button" class="icon-btn" data-close aria-label="ปิด"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>';
  const ret = mode === 'return';
  openSheet('<h3>'+(ret ? 'เลือกไฟล์ที่เพิ่งส่งออก' : 'อัปเดต Timeline')+x+'</h3>'+
    (ret ? '<p class="muted" style="font-size:14px;margin:0 0 16px">แตะไฟล์บนสุดในหมวด <b>ล่าสุด</b> แอปจะอ่านไฟล์ในเครื่องนี้และเก็บไว้แค่ผลสรุป</p>'
      : '<ol class="tl-steps"><li>กดปุ่มด้านล่าง แอปจะเปิดหน้าตำแหน่งของเครื่อง</li><li>เลื่อนลงล่างสุด แตะ <b>บริการตำแหน่ง</b> → <b>ไทม์ไลน์</b> → เลือกบัญชี → <b>ส่งออกข้อมูลไทม์ไลน์</b> → บันทึก</li><li>กลับมาที่แอป แล้วแตะไฟล์บนสุด</li></ol>')+
    '<div class="sheet-actions">'+(ret ? '<button type="button" class="btn btn-ghost" id="tlAgain">เปิดหน้าตำแหน่งอีกครั้ง</button><button type="button" class="btn btn-primary" id="tlPick2">เลือกไฟล์</button>'
      : '<button type="button" class="btn btn-ghost" id="tlPick2">มีไฟล์อยู่แล้ว</button><button type="button" class="btn btn-primary" id="tlGo">เปิดหน้าตำแหน่ง</button>')+'</div>');
  const on = (sel, fn) => { const e = $(sel); if (e) e.addEventListener('click', fn); };
  on('#tlAgain', startTimelineUpdate); on('#tlGo', startTimelineUpdate); on('#tlPick2', pickTimelineNative);
}
function initTlFlow(){
  const n = nat();
  if (n && n.addListener) { try { n.addListener('appResumed', () => setTimeout(onAppReturnTl, 250)); } catch(e){} }
  setTimeout(onAppReturnTl, 600); // app may have been closed while exporting
}
function onNotificationTap(kind){
  if (kind === 'export') { setTab('summary'); if (nat()) openTlSheet('start'); }
  else if (kind === 'prep' || kind === 'send') setTab('leave');
}

function render(){
  recompute(); updatePendingBar(); scheduleRemindersSoon();
  const t = TODAY();
  $('#todayLabel').textContent = fmtLong(t);
  const v = $('#view');
  v.innerHTML = tab==='home' ? viewHome() : tab==='leave' ? viewLeave() : tab==='car' ? viewCar() : viewSummary();
  bindView();
}

function bindView(){
  const v = $('#view');
  v.querySelectorAll('[data-todo]').forEach(btn => btn.addEventListener('click', () => {
    const todos = buildTodos(state, TODAY()); const t = todos[Number(btn.dataset.todo)]; if (!t) return;
    if (t.kind==='timesheet') openTimesheet(t.key);
    else if (t.kind==='absent') { if (typeof sumMonth !== 'undefined') sumMonth = t.key; setTab('summary'); }
    else if (t.kind==='unknown') openLeave(state.leaves.find(l => l.id===t.ids[0]));
    else openLeave(state.leaves.find(l => l.id===t.id));
  }));
  v.querySelectorAll('[data-leave]').forEach(btn => btn.addEventListener('click', () => openLeave(state.leaves.find(l => l.id===btn.dataset.leave))));
  v.querySelectorAll('[data-day]').forEach(btn => btn.addEventListener('click', () => {
    const l = state.leaves.find(x => x.date===btn.dataset.day);
    openLeave(l || null, btn.dataset.day);
  }));
  v.querySelectorAll('[data-ts]').forEach(btn => btn.addEventListener('click', () => openTimesheet(btn.dataset.ts)));
  v.querySelectorAll('[data-month]').forEach(b => b.addEventListener('click', () => { calMonth = b.dataset.month; render(); }));
  const mc = $('#mchips'), ms = mc && mc.querySelector('[aria-pressed="true"]');
  if (mc && ms) mc.scrollLeft = ms.offsetLeft - mc.clientWidth/2 + ms.clientWidth/2;
  const p = $('#calPrev'), n = $('#calNext');
  if (p) p.addEventListener('click', () => { calMonth = shiftMonth(calMonth,-1); render(); });
  if (n) n.addEventListener('click', () => { calMonth = shiftMonth(calMonth, 1); render(); });
  const mh = $('#manageHol'); if (mh) mh.addEventListener('click', () => openHolidays(beYear(Number(calMonth.slice(0,4)))));
  const ob1 = $('#obSync'), ob2 = $('#obImport');
  if (ob1) ob1.addEventListener('click', openSettings);
  if (ob2) ob2.addEventListener('click', pickImportFile);
  if (tab === 'summary') bindSummary();
  const c = $('#copySummary');
  if (c) c.addEventListener('click', () => copyText(leaveSummaryText(state, Number(TODAY().slice(0,4)))));
}
function shiftMonth(k, n){ let [y,m] = k.split('-').map(Number); m += n; if (m<1){m=12;y--;} if (m>12){m=1;y++;} return y+'-'+pad(m); }

function toast(msg){
  const r = $('#toastRoot'); r.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(() => r.innerHTML = '', 2400);
}
function copyText(text){
  const fallback = () => { openSheet('<h3>คัดลอกสรุป</h3><p class="muted" style="font-size:13px;margin:0 0 8px">กดค้างที่ข้อความเพื่อเลือกทั้งหมด แล้วคัดลอก</p><textarea class="input" id="copyArea" rows="12" readonly>'+esc(text)+'</textarea><div class="sheet-actions"><span></span><button type="button" class="btn btn-ghost" data-close>ปิด</button></div>');
    const a = $('#copyArea'); a.focus(); a.select(); };
  try { navigator.clipboard.writeText(text).then(() => toast('คัดลอกสรุปแล้ว วางในไลน์ได้เลย'), fallback); } catch(e){ fallback(); }
}

function writeErrMsg(ex){
  const c = ex && ex.code;
  if (c === 'quota_exceeded') return 'ที่เก็บข้อมูลเต็ม ลบรายการเก่าที่ไม่ใช้ก่อน';
  if (c === 'no_storage') return 'บันทึกไม่ได้ เพราะสัญญาณหลุดและเครื่องไม่ยอมให้เก็บข้อมูลชั่วคราว ลองใหม่เมื่อมีเน็ต';
  return 'บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง';
}

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  $('#sheetRoot').innerHTML = '<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  const ov = $('#overlay');
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  ov.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });
  const f = ov.querySelector('input,select,textarea,button'); if (f) f.focus();
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; if (lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){} }

function openLeave(l, presetDate){
  const isNew = !l;
  const cur = l ? { ...l, docs:{...(l.docs||{})} } : { date: presetDate || TODAY(), type:'sick', half:false, reason:'', docs:{} };
  const typeSeg = ['sick','personal','vacation','unknown'].map(t => '<input type="radio" name="lvType" id="lt_'+t+'" value="'+t+'"'+(cur.type===t?' checked':'')+'><label for="lt_'+t+'" class="c-'+t+'">'+TYPES[t].label+'</label>').join('');
  const halfSeg = [['full','เต็มวัน'],['am','ครึ่งเช้า'],['pm','ครึ่งบ่าย']].map(([v,lab]) => '<input type="radio" name="lvHalf" id="lh_'+v+'" value="'+v+'"'+(((cur.half||'full')===v)?' checked':'')+'><label for="lh_'+v+'">'+lab+'</label>').join('');
  openSheet(
    '<h3>'+(isNew?'แจ้งลา':'แก้ไขการลา')+'<button type="button" class="icon-btn" data-close aria-label="ปิด"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></h3>'+
    '<form id="leaveForm" novalidate>'+
    '<div class="field"><label for="lvDate">วันที่</label><input class="input num" type="date" id="lvDate" value="'+esc(cur.date)+'" required></div>'+
    '<div class="field"><span class="lab" id="lvTypeLab">ประเภท</span><div class="seg" role="radiogroup" aria-labelledby="lvTypeLab">'+typeSeg+'</div></div>'+
    '<div class="field"><span class="lab" id="lvHalfLab">ระยะเวลา</span><div class="seg" role="radiogroup" aria-labelledby="lvHalfLab">'+halfSeg+'</div></div>'+
    '<div class="field"><label for="lvReason">เหตุผล (ไม่บังคับ)</label><input class="input" type="text" id="lvReason" maxlength="120" value="'+esc(cur.reason)+'" placeholder="เช่น ไปหาหมอ, สอบโปรเจค"></div>'+
    '<div class="field" id="docsField"></div>'+
    '<p class="err" id="lvErr" role="alert"></p>'+
    '<div class="sheet-actions">'+(isNew?'<span></span>':'<button type="button" class="btn btn-danger" id="lvDelete">ลบ</button>')+
    '<button type="submit" class="btn btn-primary">'+(isNew?'บันทึก':'บันทึกการแก้ไข')+'</button></div>'+
    '</form>');
  const form = $('#leaveForm');
  const read = () => ({ ...cur,
    date: $('#lvDate').value,
    type: form.querySelector('input[name=lvType]:checked').value,
    half: (v => v==='full' ? false : v)(form.querySelector('input[name=lvHalf]:checked').value),
    reason: $('#lvReason').value.trim(),
    docs: Object.fromEntries(['form','cert','evidence'].map(k => [k, !!(form.querySelector('#doc_'+k) && form.querySelector('#doc_'+k).checked) || (!form.querySelector('#doc_'+k) && !!cur.docs[k])])) });
  const drawDocs = () => {
    const x = read(); const hmap = holidayMap(state.holidays);
    const others = state.leaves.filter(o => o.id !== cur.id).concat([x]);
    const req = requiredDocs(x, hmap, others);
    const show = x.type==='unknown' ? [] : x.type==='sick' ? ['form','cert'] : x.type==='personal' ? ['form','evidence'] : ['form'];
    $('#docsField').innerHTML = show.length ? '<span class="lab">เอกสาร</span>'+show.map(k =>
      '<label class="check"><input type="checkbox" id="doc_'+k+'"'+(x.docs[k]?' checked':'')+'><span>ส่ง'+DOCS[k]+'แล้ว'+(req.includes(k)?' <span class="req">จำเป็น</span>':'')+
      (k==='cert' && req.includes('cert') ? '<br><small>ลาป่วยติดวันหยุด หรือติดกัน 3 วันขึ้นไป</small>':'')+'</span></label>').join('')
      : '<span class="lab">เอกสาร</span><span class="muted" style="font-size:13px">เลือกประเภทลาก่อน แล้วจะขึ้นรายการเอกสารที่ต้องส่ง</span>';
  };
  drawDocs();
  form.addEventListener('change', e => { if (e.target.name==='lvType' || e.target.id==='lvDate') { const keep = read(); cur.docs = keep.docs; drawDocs(); } });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const x = read(); const err = $('#lvErr'); err.textContent = '';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date)) { err.textContent = 'เลือกวันที่ก่อนบันทึก'; return; }
    const hmap = holidayMap(state.holidays);
    if (!isWorkday(x.date, hmap)) { err.textContent = fmtLong(x.date)+' เป็นวันหยุดอยู่แล้ว ไม่ต้องแจ้งลา'; return; }
    const clash = state.leaves.find(o => o.id !== cur.id && o.date === x.date);
    if (clash && !(clash.half && x.half && clash.half !== x.half)) { err.textContent = 'มีการลาวันที่ '+fmtShort(x.date)+' อยู่แล้ว แตะวันนั้นในปฏิทินเพื่อแก้ไขแทน'; return; }
    const id = cur.id || ('l_'+x.date+'_'+Math.random().toString(36).slice(2,7));
    const body = { date:x.date, type:x.type, half:x.half, reason:x.reason, docs:x.docs, source:cur.source||'manual', updatedAt:new Date().toISOString() };
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try { const r = await commit('leaves/'+id, 'set', body); closeSheet(); toast(r==='saved' ? (isNew?'บันทึกการลาแล้ว':'บันทึกการแก้ไขแล้ว') : 'สัญญาณไม่ดี บันทึกไว้ในเครื่องแล้ว จะส่งเองเมื่อเน็ตกลับมา'); }
    catch(ex){ btn.disabled = false; err.textContent = writeErrMsg(ex); }
  });
  const del = $('#lvDelete');
  if (del) del.addEventListener('click', async () => {
    if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'แตะอีกครั้งเพื่อลบ'; return; }
    del.disabled = true;
    try { const r = await commit('leaves/'+cur.id, 'delete'); closeSheet(); toast(r==='saved' ? 'ลบการลาแล้ว' : 'สัญญาณไม่ดี จะลบให้เมื่อเน็ตกลับมา'); }
    catch(ex){ del.disabled = false; $('#lvErr').textContent = writeErrMsg(ex); }
  });
}

const HOLIDAY_PRESETS = [
  { name:'วันขึ้นปีใหม่', md:['01-01'] }, { name:'วันตรุษจีน' }, { name:'วันมาฆบูชา' }, { name:'วันจักรี', md:['04-06'] },
  { name:'วันสงกรานต์', md:['04-13','04-14','04-15'] }, { name:'วันแรงงานแห่งชาติ', md:['05-01'] }, { name:'วันฉัตรมงคล', md:['05-04'] },
  { name:'วันพืชมงคล' }, { name:'วันวิสาขบูชา' }, { name:'วันเฉลิมพระชนมพรรษา สมเด็จพระราชินี', md:['06-03'] },
  { name:'วันอาสาฬหบูชา' }, { name:'วันเข้าพรรษา' }, { name:'วันเฉลิมพระชนมพรรษา ร.10', md:['07-28'] },
  { name:'วันแม่แห่งชาติ', md:['08-12'] }, { name:'วันนวมินทรมหาราช', md:['10-13'] }, { name:'วันปิยมหาราช', md:['10-23'] },
  { name:'วันพ่อแห่งชาติ', md:['12-05'] }, { name:'วันรัฐธรรมนูญ', md:['12-10'] }, { name:'วันสิ้นปี', md:['12-31'] }, { name:'วันหยุดพิเศษ' }
];
const COMP = 'ชดเชย';
function splitHolidayName(n){ n = String(n||''); return n.indexOf(COMP) === 0 ? { comp:true, base:n.slice(COMP.length) } : { comp:false, base:n }; }
function holidayDocsByYear(){ // BE year -> days[] (from current state)
  const m = {}; state.holidays.forEach(h => { const be = beYear(Number(h.date.slice(0,4))); (m[be] = m[be] || []).push({ date:h.date, name:h.name }); });
  return m;
}
function fixedCopyFrom(prevDays, ceYear){
  const out = [];
  prevDays.forEach(h => { const sp = splitHolidayName(h.name); if (sp.comp) return;
    const p = HOLIDAY_PRESETS.find(x => x.name === sp.base && x.md); const md = h.date.slice(5);
    if (p && p.md.includes(md)) out.push({ date: ceYear+'-'+md, name: h.name }); });
  return out;
}
let holYearView = null, holEdit = null;
function openHolidays(beY, editDate){
  const byYear = holidayDocsByYear();
  const curBE = beYear(Number(TODAY().slice(0,4)));
  holYearView = beY || holYearView || curBE; holEdit = editDate || null;
  const ceY = holYearView - 543;
  const days = (byYear[holYearView] || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const prev = byYear[holYearView-1] || [];
  const editing = holEdit ? days.find(d => d.date === holEdit) : null;
  const sp = editing ? splitHolidayName(editing.name) : { comp:false, base:'' };
  const used = [...new Set(state.holidays.map(h => splitHolidayName(h.name).base))].filter(n => n && !HOLIDAY_PRESETS.some(p => p.name === n));
  const opt = n => '<option value="'+esc(n)+'"'+(sp.base===n?' selected':'')+'>'+esc(n)+'</option>';
  const isOther = editing && !HOLIDAY_PRESETS.some(p => p.name === sp.base) && !used.includes(sp.base);
  const rows = days.length ? days.map(d => '<div class="hol-row" style="align-items:center"><span style="min-width:0">'+esc(d.name)+'<br><span class="muted num" style="font-size:13px">'+fmtDay(d.date)+'</span></span>'+
      '<span class="tool-row" style="gap:4px;flex-wrap:nowrap"><button type="button" class="icon-btn" data-hedit="'+d.date+'" aria-label="แก้ไข '+esc(d.name)+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></button>'+
      '<button type="button" class="icon-btn" data-hdel="'+d.date+'" aria-label="ลบ '+esc(d.name)+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button></span></div>').join('')
    : '<div class="all-done">ยังไม่มีวันหยุดปี '+holYearView+'</div>';
  const copyBtn = !days.length && prev.length ? '<button type="button" class="btn btn-ghost" id="hCopy" style="width:100%;margin-top:8px">คัดลอกวันหยุดวันเดิมจากปี '+(holYearView-1)+' ('+fixedCopyFrom(prev, ceY).length+' วัน)</button>' : '';
  openSheet('<h3>วันหยุดบริษัท<button type="button" class="icon-btn" data-close aria-label="ปิด"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></h3>'+

const THEME_ICON = {
  auto:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"></path></svg>',

};
const rootEl = document.documentElement;
let hostTheme = null;
let themeChoice = 'auto';
try { const t = localStorage.getItem(THEME_KEY); if (THEME_ORDER.includes(t)) themeChoice = t; } catch(e){}
let applyingTheme = false;
function applyTheme(){
  applyingTheme = true;
  const want = themeChoice === 'auto' ? hostTheme : themeChoice;
  if (want) rootEl.setAttribute('data-theme', want); else rootEl.removeAttribute('data-theme');
  applyingTheme = false;
  const b = document.getElementById('themeBtn');
  b.innerHTML = THEME_ICON[themeChoice];
  b.setAttribute('aria-label', 'ธีม: '+THEME_LABEL[themeChoice]+' · แตะเพื่อเปลี่ยน');
  b.title = 'ธีม: '+THEME_LABEL[themeChoice];
  requestAnimationFrame(() => { try { document.getElementById('themeColor').setAttribute('content', getComputedStyle(document.body).backgroundColor); } catch(e){} });
}
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => applyTheme()); } catch(e){}
new MutationObserver(() => {
  if (applyingTheme) return;
  const cur = rootEl.getAttribute('data-theme');
  if (themeChoice === 'auto') { hostTheme = cur; return; }
  if (cur !== themeChoice) { hostTheme = cur; applyTheme(); }
}).observe(rootEl, { attributes:true, attributeFilter:['data-theme'] });
document.getElementById('themeBtn').addEventListener('click', () => {
  themeChoice = THEME_ORDER[(THEME_ORDER.indexOf(themeChoice)+1) % THEME_ORDER.length];
  try { localStorage.setItem(THEME_KEY, themeChoice); } catch(e){}
  applyTheme(); toast('ธีม: '+THEME_LABEL[themeChoice]);
});
applyTheme();

/* ---------- Android app (Capacitor): local reminders + update check ---------- */
const APP_VERSION = '0.0.0';
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const LN = isNative && window.Capacitor.Plugins ? window.Capacitor.Plugins.LocalNotifications : null;
const TEST_NOTIF_ID = 9999;
let notifPerm = 'unknown', exactOk = null, lastSchedHash = '', schedTimer = null, lastSchedError = '';
async function notifInit(){
  if (!LN) return;
  try { LN.addListener('localNotificationActionPerformed', a => { const ex = a && a.notification && a.notification.extra; onNotificationTap(ex && ex.kind); }); } catch(e){}
  try { await LN.createChannel({ id:'reminders', name:'การเตือน', description:'เตือน Timesheet เอกสารลา และ Export Timeline', importance:5, visibility:1, vibration:true }); } catch(e){}
  await refreshNotifStatus();
  if (notifPerm === 'prompt' || notifPerm === 'prompt-with-rationale') await askNotifPermission();
  scheduleReminders(true);
}
async function refreshNotifStatus(){
  if (!LN) return;
  try { const p = await LN.checkPermissions(); notifPerm = p.display; } catch(e){ notifPerm = 'unknown'; }
  try { const x = await LN.checkExactNotificationSetting(); exactOk = x.exact_alarm === 'granted'; } catch(e){ exactOk = null; }
}
async function askNotifPermission(){
  if (!LN) return 'denied';
  try { const p = await LN.requestPermissions(); notifPerm = p.display; } catch(e){}
  if (notifPerm === 'granted') scheduleReminders(true);
  return notifPerm;
}
function scheduleRemindersSoon(){ if (!LN) return; clearTimeout(schedTimer); schedTimer = setTimeout(() => scheduleReminders(false), 800); }
async function scheduleReminders(force){
  if (!LN || notifPerm !== 'granted') return [];
  const list = computeReminders(state, new Date(), 3);
  const hash = JSON.stringify(list.map(r => [r.id, +r.at, r.title, r.body]));
  if (!force && hash === lastSchedHash) return list;
  try {
    const pend = await LN.getPending();
    const ours = ((pend && pend.notifications) || []).filter(n => Number(n.id) !== TEST_NOTIF_ID).map(n => ({ id: Number(n.id) }));
    if (ours.length) await LN.cancel({ notifications: ours });
    if (list.length) await LN.schedule({ notifications: list.map(r => ({
      id: r.id, title: r.title, body: r.body, largeBody: r.body, channelId: 'reminders',
      smallIcon: 'ic_stat_mylog', iconColor: '#F01E14',
      schedule: { at: r.at, allowWhileIdle: true }, extra: { kind: r.kind, date: r.date } })) });
    lastSchedHash = hash; lastSchedError = '';
  } catch(e){ lastSchedError = String((e && e.message) || e); }
  return list;
}
async function testNotification(){
  if (!LN) { toast('การแจ้งเตือนใช้ได้ในแอป Android เท่านั้น'); return; }
  if (notifPerm !== 'granted' && (await askNotifPermission()) !== 'granted') { toast('ยังไม่ได้อนุญาตการแจ้งเตือน'); return; }
  try {
    await LN.schedule({ notifications: [{ id: TEST_NOTIF_ID, title: 'My Log · ทดสอบ', body: 'ถ้าเห็นข้อความนี้ แปลว่าแจ้งเตือนใช้ได้แล้ว', channelId: 'reminders',
      smallIcon: 'ic_stat_mylog', iconColor: '#F01E14', schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true } }] });
    toast('จะเด้งใน 5 วินาที กลับไปหน้าจอโฮมรอได้เลย');
  } catch(e){ toast('ตั้งแจ้งเตือนไม่สำเร็จ: '+((e && e.message) || e)); }
}
async function openExactSetting(){ if (!LN) return; try { await LN.changeExactNotificationSetting(); } catch(e){} setTimeout(refreshNotifStatus, 1500); }

let latestRelease = null;
function cmpVer(a, b){ const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++){ const d = (pa[i]||0) - (pb[i]||0); if (d) return d > 0 ? 1 : -1; } return 0; }
async function checkUpdate(){
  if (!isNative) return;
  try {
    const r = await fetch('https://api.github.com/repos/PlanB-maker/mylog/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json();
    const v = String(j.tag_name || '').replace(/^v/, '');
    const apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
    if (apk && cmpVer(v, APP_VERSION) > 0) { latestRelease = { version: v, url: apk.browser_download_url }; render(); }
  } catch(e){}
}

  const upcoming = computeReminders(state, new Date(), 3).slice(0, 5);
  const permTxt = notifPerm === 'granted' ? '<span class="ok-t">อนุญาตแล้ว</span>' : '<span class="no-t">ยังไม่อนุญาต</span>';
  const exactTxt = exactOk === null ? '' : ' · เตือนตรงเวลา: '+(exactOk ? '<span class="ok-t">ได้</span>' : '<span class="no-t">ยังไม่ได้</span>');
  return '<div class="set-sec"><h4>แจ้งเตือน</h4><p class="sync-status">การแจ้งเตือน: '+permTxt+exactTxt+'</p>'+
    (lastSchedError ? '<p class="sync-status bad">ตั้งเตือนไม่สำเร็จ: '+esc(lastSchedError)+'</p>' : '')+
    '<div class="tool-row" style="margin-bottom:12px">'+
      (notifPerm !== 'granted' ? '<button type="button" class="btn btn-primary" id="nAllow">อนุญาตการแจ้งเตือน</button>' : '')+
      '<button type="button" class="btn btn-ghost" id="nTest">ทดสอบแจ้งเตือน</button>'+
      (exactOk === false ? '<button type="button" class="btn btn-ghost" id="nExact">ตั้งค่าเตือนตรงเวลา</button>' : '')+
    '</div>'+
    '<p class="muted" style="font-size:13px;margin:0 0 6px">เตือนที่ตั้งไว้ถัดไป</p>'+
    (upcoming.length ? '<div class="card">'+upcoming.map(r => '<div class="hol-row"><span style="min-width:0">'+esc(r.title)+'<br><span class="muted" style="font-size:12px">'+esc(r.body)+'</span></span><span class="num" style="white-space:nowrap">'+fmtReminderTime(r.at)+'</span></div>').join('')+'</div>'
      : '<div class="all-done">ไม่มีเตือนที่ต้องตั้งใน 3 เดือนข้างหน้า</div>')+
    '<p class="muted" style="font-size:12px;margin:10px 0 0">POCO / HyperOS: ตั้งค่ามือถือ → แอป → จัดการแอป → My Log → เปิด "เริ่มอัตโนมัติ" และตั้ง "ประหยัดแบตเตอรี่" เป็น "ไม่จำกัด" ไม่งั้นแจ้งเตือนอาจไม่เด้ง</p></div>';
}
function bindNotifSection(){
  const a = $('#nAllow'), t = $('#nTest'), x = $('#nExact');
  if (a) a.addEventListener('click', async () => { await askNotifPermission(); closeSheet(); openSettings(); });
  if (t) t.addEventListener('click', testNotification);
  if (x) x.addEventListener('click', openExactSetting);
}

/* ---------- boot ---------- */
function showBanner(msg){ const b = $('#statusBanner'); b.textContent = msg; b.hidden = !msg; }
async function boot(){
  const h = (location.hash||'').slice(1);
  if (['home','leave','car','summary'].includes(h)) tab = h;
  if (!storageOk) showBanner('เครื่องไม่ยอมให้แอปเก็บข้อมูล ข้อมูลที่บันทึกจะหายเมื่อปิดแอป');
  setTab(tab);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (!isNative && 'serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
  sync();
  if (isNative) { notifInit(); checkUpdate(); initTlFlow(); }
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 120000);
}
boot();
</script>
